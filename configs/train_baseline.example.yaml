# Training configuration template (TASK-12).
# Copy per experiment as configs/<experiment_name>.yaml and commit it, so every
# run in docs/experiments.md can be reproduced from its configuration alone.

experiment_name: cardd_damage_baseline   # also the results folder name
description: Baseline damage model, default settings, no custom augmentation

dataset: data/cardd/processed/cardd.yaml
model: yolo11n-seg.pt                    # pretrained weights to start from
task: segment

epochs: 50
imgsz: 640
batch: 16
seed: 42
device: mps                              # mps on Apple silicon, 0 for CUDA, cpu otherwise

# Leave augmentation at framework defaults for the baseline. Improvement
# experiments (TASK-16, TASK-17) override these and record the delta.
augment: false
